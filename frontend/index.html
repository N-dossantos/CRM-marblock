<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM Marblock — Gestión de Ventas</title>
    <script>
      // Se aplica antes de pintar la página para evitar un destello del tema equivocado.
      let theme
      try { theme = localStorage.getItem('crm-theme') } catch {}
      document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
        ? theme
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      let fontSize
      try { fontSize = localStorage.getItem('crm-font-size') } catch {}
      document.documentElement.dataset.fontSize = ['small', 'normal', 'large'].includes(fontSize)
        ? fontSize : 'normal'
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
